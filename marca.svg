  <circle class="pz-hub" cx="172.47" cy="63.67" r="10.5" stroke-width="7"/>
  <circle class="pz-node" cx="120.0" cy="33.9" r="5.5" stroke-width="4.6"/>
  <circle class="pz-node" cx="33.9" cy="120.0" r="5.5" stroke-width="4.6"/>
  <circle class="pz-node" cx="206.1" cy="120.0" r="5.5" stroke-width="4.6"/>
  <circle class="pz-node" cx="120.0" cy="206.1" r="5.5" stroke-width="4.6"/>
  <circle class="pz-node" cx="68.9" cy="120.0" r="6.1" stroke-width="5.8"/>
  <circle class="pz-node" cx="171.1" cy="120.0" r="6.1" stroke-width="5.8"/>
  </g>
  <polygon class="pz-head" fill="#ffffff" points="208.7,24.71 203.36,56.88 176.99,32.37"/>
